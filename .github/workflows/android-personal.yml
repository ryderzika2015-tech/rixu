name: Android personal APK
on:
  push:
    branches: [codex/android-personal-v034, codex/android-reminders-v035, codex/android-stable-v036]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-personal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - run: npm run build:offline && npm test
      - run: npm run android:prepare
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - run: mkdir -p signing-tools && cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: rixu-unsigned-release
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            signing-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 14
